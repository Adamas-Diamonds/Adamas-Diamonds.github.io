<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火夜芒的主页</title>
    <link rel="icon" type="image/png" href="1786187009.png">
    <style>
        /* --- 全局样式重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 防止出现滚动条 */
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* --- 背景区域 (包含图片和渐变遮罩) --- */
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 放在最底层 */
            
            /* 这里设置背景图片，您可以替换 url 中的链接为您自己的图片 */
            background-image: url('https://kukechat.cn-nb1.rains3.com/messages/9812da52d10442f4ab4b926730fcb393.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* 渐变遮罩层：让背景变暗，突出文字，同时制造渐变效果 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 线性渐变：从半透明黑到深蓝紫色 */
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(20, 10, 50, 0.8) 100%);
            backdrop-filter: blur(5px); /* 毛玻璃模糊效果 */
        }

        /* --- 主要内容容器 --- */
        .main-content {
            text-align: center;
            z-index: 1;
            animation: fadeIn 1.5s ease-out; /* 入场动画 */
        }

        /* --- 核心点击文字样式 --- */
        .main-link {
            text-decoration: none;
            color: #fff;
            font-size: 3rem; /* 字体大小 */
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.5); /* 文字阴影 */
            transition: all 0.3s ease;
            display: inline-block;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        /* 鼠标悬停效果 */
        .main-link:hover {
            transform: translateY(-5px); /* 向上浮动 */
            color: #a5f3fc; /* 变成浅青色 */
            border-bottom: 2px solid #a5f3fc;
            text-shadow: 0 0 20px rgba(165, 243, 252, 0.6); /* 发光效果 */
        }

        /* --- 友情链接区域 --- */
        .friends-section {
            margin-top: 60px;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.1); /* 半透明白背景 */
            border-radius: 20px;
            backdrop-filter: blur(10px); /* 强毛玻璃效果 */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .friends-title {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .friends-list {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .friend-item {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50px; /* 胶囊形状 */
            color: #ddd;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .friend-item:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* --- 动画定义 --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 移动端适配 --- */
        @media (max-width: 768px) {
            .main-link {
                font-size: 2rem;
            }
            .friends-section {
                margin: 40px 20px;
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- 背景层 -->
    <div class="background-container">
        <div class="overlay"></div>
    </div>

    <!-- 主要内容 -->
    <div class="main-content">
        <!-- 点击跳转区域 -->
        <!-- 目标链接：https://www.ccw.site/student/69573ee886bbc77f84e41ee3 -->
        <a href="https://www.ccw.site/student/69573ee886bbc77f84e41ee3" class="main-link" target="_blank">
            星火夜芒@CCW
        </a>

        <!-- 友情链接区域 -->
        <div class="friends-section">
            <div class="friends-title">友情链接 / Friends</div>
            <div class="friends-list">
                <!-- 您可以在这里添加更多的链接 -->
                <a href="https://www.ccwmoran.top/" class="friend-item">CCWMORAN慕然科技</a>
                <a href="https://www.caellab.com/" class="friend-item">虚舟实验室</a>
                <a href="https://www.chen-jin.dpdns.org/" class="friend-item">Chen-Jin的网站</a>
                <a href="https://ccw-by.netlify.app/" class="friend-item">α冰＆β云的网站</a>
                <a href="#" class="friend-item">友链空位</a>
            </div>
        </div>
    </div>

    <script>
        // 简单的交互逻辑（其实用 href 就可以跳转，这里是为了演示如果需要 JS 控制）
        document.querySelector('.main-link').addEventListener('click', function(e) {
            console.log("正在跳转至 CCW 主页...");
            // 如果需要额外的统计代码或者特效，可以在这里加
        });
    </script>
</body>
</html>
